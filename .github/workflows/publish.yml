name: Validate and publish script packages
on:
  pull_request:
  push:
    branches: [main]
    paths: ['bundles/**', 'tools/**', 'tests/**', 'package*.json', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
  publish:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: script-package-publish
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish catalog and immutable archives
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog.json packages
          if ! git diff --cached --quiet; then
            git commit -m 'build: 更新脚本包与目录索引'
            git push origin HEAD:main
          fi
